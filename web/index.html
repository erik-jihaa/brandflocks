    <script>
      (function () {

        var host = location.hostname
        var isPlatform = path.indexOf('/platform') === 0
        var isStaging = host.indexOf('staging') >= 0 || host === 'localhost' || host === '127.0.0.1'
        var brand = isPlatform
          ? { title: 'Brandflocks platform', icon: '/favicon-white.svg' }
          : isStaging
            ? { title: 'Brandflocks staging', icon: '/favicon-green.svg' }
            : { title: 'Brandflocks', icon: '/favicon-blue.svg' }
        document.title = brand.title
        var link = document.querySelector('link[rel="icon"]')
        if (!link) {
          link = document.createElement('link')
          link.rel = 'icon'
          document.head.appendChild(link)
        }
        link.type = 'image/svg+xml'
        link.href = brand.icon
      })()
